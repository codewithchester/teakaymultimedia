{% load static %}
{% if settings_obj.homepage_audio or True %}
<div class="audio-intro" data-audio-player>
    <div class="audio-intro__header">
        <div class="audio-intro__icon" aria-hidden="true">
            <i class="bx bx-headphone"></i>
        </div>
        <div>
            <div class="audio-intro__title">Audio Introduction</div>
            <div class="audio-intro__subtitle">A short welcome from {{ BRAND_NAME }}</div>
        </div>
    </div>

    <audio preload="metadata">
        {% if settings_obj.homepage_audio %}
            <source src="{{ settings_obj.homepage_audio.url }}" type="audio/mpeg">
        {% else %}
            <source src="{% static 'audio/intro.mp3' %}" type="audio/mpeg">
        {% endif %}
        Your browser does not support the audio element.
    </audio>

    <div class="audio-intro__controls">
        <button type="button" class="audio-intro__play" data-audio-play aria-label="Play audio introduction">
            <i class="bx bx-play" aria-hidden="true"></i>
        </button>
        <div class="audio-intro__progress" data-audio-progress role="slider" aria-label="Audio progress" tabindex="0">
            <div class="audio-intro__progress-fill" data-audio-fill></div>
        </div>
        <div class="audio-intro__time" data-audio-time>0:00 / 0:00</div>
    </div>

    {% if settings_obj.homepage_audio_transcript %}
        <button type="button"
                class="audio-intro__transcript-toggle"
                data-audio-transcript-toggle
                aria-expanded="false">
            Show transcript
        </button>
        <div class="audio-intro__transcript" data-audio-transcript hidden>
            {{ settings_obj.homepage_audio_transcript }}
        </div>
    {% endif %}
</div>
{% endif %}
